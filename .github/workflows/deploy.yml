name: Website checks and deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: yarn
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - run: yarn run check
      # dumi can emit ~demos/:id/index.html. Upload a tarball so artifact
      # filename validation does not reject colons inside the generated site.
      - name: Package website
        run: tar -czf "$RUNNER_TEMP/website.tar.gz" -C dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website
          path: ${{ runner.temp }}/website.tar.gz
          if-no-files-found: error
          compression-level: 0
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website
          path: ${{ runner.temp }}/website-artifact
      - name: Extract website
        run: |
          mkdir -p dist
          tar -xzf "$RUNNER_TEMP/website-artifact/website.tar.gz" -C dist
          test -s dist/index.html
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: hapin.js.org
          user_name: Herbert He
          user_email: Herbert.He0229@gmail.com
